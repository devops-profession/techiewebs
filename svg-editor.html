<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>svg /// editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:        #0d0f0d;
    --panel:     #131613;
    --line:      #23281f;
    --line-dim:  #1a1d17;
    --text:      #d9e0d3;
    --text-dim:  #6f7a68;
    --accent:    #00ff7f;
    --accent-dim:#0a3d24;
    --cyan:      #00d4ff;
    --mono: "IBM Plex Mono", "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--mono);
    overflow:hidden;
  }

  /* ---------- top bar ---------- */
  .topbar{
    height:44px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .brand{
    font-size:13px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--text);
    display:flex; align-items:center; gap:8px;
  }
  .brand .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
  }
  .brand small{ color:var(--text-dim); font-weight:normal; letter-spacing:.05em; }

  .topbar-right{ display:flex; align-items:center; gap:10px; }

  .mode-toggle{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--text-dim);
    letter-spacing:.05em; text-transform:uppercase;
    user-select:none;
  }
  .switch{
    position:relative; width:34px; height:18px;
    background:var(--line); border-radius:10px;
    cursor:pointer; transition:background .15s ease;
    border:1px solid var(--line);
  }
  .switch.on{ background:var(--accent-dim); border-color:var(--accent); }
  .switch .knob{
    position:absolute; top:1px; left:1px;
    width:14px; height:14px; border-radius:50%;
    background:var(--text-dim);
    transition:transform .15s ease, background .15s ease;
  }
  .switch.on .knob{ transform:translateX(16px); background:var(--accent); }

  button{
    font-family:var(--mono);
    font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    background:transparent; color:var(--text);
    border:1px solid var(--line);
    padding:8px 14px;
    cursor:pointer;
    transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  button:hover{ border-color:var(--accent); color:var(--accent); }
  button:active{ background:var(--accent-dim); }
  #updateBtn.pulse{
    border-color:var(--cyan); color:var(--cyan);
  }
  #updateBtn.pulse:hover{ border-color:var(--accent); color:var(--accent); }

  /* ---------- layout ---------- */
  .wrap{
    display:grid;
    grid-template-columns: 1fr 1fr;
    height:calc(100% - 44px);
  }

  .pane{
    display:flex; flex-direction:column;
    min-width:0; min-height:0;
    position:relative;
  }
  .pane + .pane{ border-left:1px solid var(--line); }

  .pane-header{
    height:32px; flex:none;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 14px;
    font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-dim);
    border-bottom:1px solid var(--line-dim);
    background:var(--panel);
  }
  .pane-header .tag{
    color:var(--text-dim);
    font-size:10px;
  }

  /* ---------- code pane ---------- */
  .code-area{
    flex:1; position:relative; min-height:0;
    background:var(--bg);
  }
  textarea#code{
    width:100%; height:100%;
    resize:none; border:none; outline:none;
    background:transparent; color:var(--text);
    font-family:var(--mono);
    font-size:13px; line-height:1.6;
    padding:16px 16px 16px 56px;
    tab-size:2;
    caret-color:var(--accent);
  }
  .gutter{
    position:absolute; top:0; left:0; bottom:0; width:44px;
    padding:16px 0;
    text-align:right;
    font-size:13px; line-height:1.6;
    color:#3a4136;
    background:var(--panel);
    border-right:1px solid var(--line-dim);
    user-select:none;
    overflow:hidden;
    pointer-events:none;
  }
  .gutter div{ padding-right:10px; }

  .error-bar{
    flex:none;
    min-height:0;
    max-height:0;
    overflow:hidden;
    font-size:11px;
    color:#ff5f6d;
    background:#1a0d0f;
    border-top:1px solid #3a1418;
    transition:max-height .15s ease;
    padding:0 14px;
  }
  .error-bar.show{ max-height:60px; padding:10px 14px; }

  /* ---------- preview pane ---------- */
  .preview-area{
    flex:1; position:relative; min-height:0;
    overflow:auto;
    background:
      linear-gradient(var(--line-dim) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, var(--line-dim) 1px, transparent 1px) 0 0 / 24px 24px,
      var(--bg);
    display:flex; align-items:center; justify-content:center;
  }
  .preview-area::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 120px 120px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 120px 120px;
    pointer-events:none;
    opacity:.6;
  }

  .stage{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 0 24px rgba(0,0,0,.5));
  }
  .stage svg{
    max-width:70vw;
    max-height:70vh;
    display:block;
  }

  .crosshair{
    position:absolute;
    pointer-events:none;
  }
  .crosshair.h{ left:-9999px; right:-9999px; height:1px; background:rgba(0,255,127,.18); }
  .crosshair.v{ top:-9999px; bottom:-9999px; width:1px; background:rgba(0,255,127,.18); }

  .dims{
    position:absolute; bottom:10px; left:12px;
    font-size:10px; letter-spacing:.08em;
    color:var(--text-dim);
    background:rgba(19,22,19,.8);
    border:1px solid var(--line);
    padding:5px 9px;
    pointer-events:none;
  }
  .dims b{ color:var(--cyan); font-weight:normal; }

  .zoom-controls{
    position:absolute; bottom:10px; right:12px;
    display:flex; gap:1px;
    border:1px solid var(--line);
  }
  .zoom-controls button{
    border:none; padding:6px 10px; font-size:12px;
    border-right:1px solid var(--line);
  }
  .zoom-controls button:last-child{ border-right:none; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--panel); }
  ::-webkit-scrollbar-thumb{ background:var(--line); border:2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover{ background:var(--text-dim); }

  @media (max-width: 800px){
    .wrap{ grid-template-columns:1fr; grid-template-rows:1fr 1fr; }
    .pane + .pane{ border-left:none; border-top:1px solid var(--line); }
    .stage svg{ max-width:90vw; max-height:40vh; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>svg<small>/// editor</small></div>
  <div class="topbar-right">
    <div class="mode-toggle">
      live
      <div class="switch on" id="liveSwitch"><div class="knob"></div></div>
    </div>
    <button id="updateBtn">Update ▸</button>
  </div>
</div>

<div class="wrap">

  <div class="pane">
    <div class="pane-header">
      <span>source.svg</span>
      <span class="tag" id="charCount">0 chars</span>
    </div>
    <div class="code-area">
      <div class="gutter" id="gutter"></div>
      <textarea id="code" spellcheck="false"></textarea>
    </div>
    <div class="error-bar" id="errorBar"></div>
  </div>

  <div class="pane">
    <div class="pane-header">
      <span>preview</span>
      <span class="tag" id="viewboxTag">—</span>
    </div>
    <div class="preview-area" id="previewArea">
      <div class="stage" id="stage"></div>
      <div class="dims" id="dims">—</div>
      <div class="zoom-controls">
        <button id="zoomOut">−</button>
        <button id="zoomReset">100%</button>
        <button id="zoomIn">+</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  const codeEl      = document.getElementById('code');
  const gutterEl     = document.getElementById('gutter');
  const stageEl      = document.getElementById('stage');
  const errorBar     = document.getElementById('errorBar');
  const updateBtn    = document.getElementById('updateBtn');
  const liveSwitch    = document.getElementById('liveSwitch');
  const charCount     = document.getElementById('charCount');
  const viewboxTag    = document.getElementById('viewboxTag');
  const dimsEl        = document.getElementById('dims');
  const zoomInBtn     = document.getElementById('zoomIn');
  const zoomOutBtn    = document.getElementById('zoomOut');
  const zoomResetBtn  = document.getElementById('zoomReset');

  let liveMode = true;
  let zoom = 1;

  const DEFAULT_SVG =
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 310 96.6">
  <path d="M 46,6.9 L 4,79.7 Q 0,86.6 8,86.6 L 100,86.6 L 100,86.6 L 54,6.9 Q 50,0 46,6.9 Z"
        fill="#00d4ff" stroke="#00ff7f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 100,0 L 200,0 L 200,0 L 154,79.7 Q 150,86.6 146,79.7 L 100,0 L 100,0 Z"
        fill="#00d4ff" stroke="#00ff7f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 246,6.9 L 200,86.6 L 200,86.6 L 292,86.6 Q 300,86.6 296,79.7 L 254,6.9 Q 250,0 246,6.9 Z"
        fill="#00d4ff" stroke="#00ff7f" stroke-width="3" stroke-linejoin="round"/>
</svg>`;

  codeEl.value = DEFAULT_SVG;

  // ---------- gutter / line numbers ----------
  function updateGutter(){
    const lines = codeEl.value.split('\n').length;
    let html = '';
    for(let i=1;i<=lines;i++) html += '<div>'+i+'</div>';
    gutterEl.innerHTML = html;
    charCount.textContent = codeEl.value.length + ' chars';
  }
  codeEl.addEventListener('scroll', ()=>{ gutterEl.scrollTop = codeEl.scrollTop; });

  // ---------- render ----------
  function render(){
    const src = codeEl.value.trim();
    errorBar.classList.remove('show');
    errorBar.textContent = '';

    if(!src){
      stageEl.innerHTML = '';
      viewboxTag.textContent = '—';
      dimsEl.textContent = '—';
      return;
    }

    try{
      const parser = new DOMParser();
      const doc = parser.parseFromString(src, 'image/svg+xml');
      const perr = doc.querySelector('parsererror');
      if(perr){
        throw new Error(perr.textContent.split('\n')[0] || 'Parse error');
      }
      const svgEl = doc.querySelector('svg');
      if(!svgEl){
        throw new Error('No <svg> root element found');
      }

      stageEl.innerHTML = '';
      stageEl.appendChild(svgEl);

      const vb = svgEl.getAttribute('viewBox');
      if(vb){
        viewboxTag.textContent = 'viewBox ' + vb;
      } else {
        const w = svgEl.getAttribute('width') || '?';
        const h = svgEl.getAttribute('height') || '?';
        viewboxTag.textContent = w + ' × ' + h;
      }

      let w = svgEl.getAttribute('width');
      let h = svgEl.getAttribute('height');
      if((!w || !h) && vb){
        const parts = vb.trim().split(/[\s,]+/);
        if(parts.length === 4){ w = parts[2]; h = parts[3]; }
      }
      dimsEl.innerHTML = (w&&h) ? ('<b>'+parseFloat(w).toFixed(1)+'</b> × <b>'+parseFloat(h).toFixed(1)+'</b>') : '—';

      applyZoom();
    }catch(err){
      errorBar.textContent = '⚠ ' + err.message;
      errorBar.classList.add('show');
    }
  }

  function applyZoom(){
    const svg = stageEl.querySelector('svg');
    if(!svg) return;
    svg.style.transform = 'scale(' + zoom + ')';
    svg.style.transition = 'transform .1s ease';
  }

  // ---------- events ----------
  codeEl.addEventListener('input', ()=>{
    updateGutter();
    if(liveMode) render();
  });

  updateBtn.addEventListener('click', render);

  liveSwitch.addEventListener('click', ()=>{
    liveMode = !liveMode;
    liveSwitch.classList.toggle('on', liveMode);
    updateBtn.classList.toggle('pulse', !liveMode);
    if(liveMode) render();
  });

  zoomInBtn.addEventListener('click', ()=>{ zoom = Math.min(zoom+0.1, 3); zoomResetBtn.textContent = Math.round(zoom*100)+'%'; applyZoom(); });
  zoomOutBtn.addEventListener('click', ()=>{ zoom = Math.max(zoom-0.1, 0.2); zoomResetBtn.textContent = Math.round(zoom*100)+'%'; applyZoom(); });
  zoomResetBtn.addEventListener('click', ()=>{ zoom = 1; zoomResetBtn.textContent = '100%'; applyZoom(); });

  // tab key inserts spaces
  codeEl.addEventListener('keydown', (e)=>{
    if(e.key === 'Tab'){
      e.preventDefault();
      const start = codeEl.selectionStart, end = codeEl.selectionEnd;
      codeEl.value = codeEl.value.slice(0,start) + '  ' + codeEl.value.slice(end);
      codeEl.selectionStart = codeEl.selectionEnd = start + 2;
      updateGutter();
      if(liveMode) render();
    }
  });

  // init
  updateGutter();
  render();
  updateBtn.classList.toggle('pulse', !liveMode);
})();
</script>

</body>
</html>
